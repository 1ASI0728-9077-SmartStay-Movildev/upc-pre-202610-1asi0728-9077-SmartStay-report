<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .canvas-border { fill: #ffffff; stroke: #1e293b; stroke-width: 2.5; }
      .inner-line { stroke: #334155; stroke-width: 1.5; fill: none; }
      
      /* Tipografía de encabezados */
      .canvas-title { font-size: 19px; font-weight: 800; fill: #0f172a; }
      .canvas-name { font-size: 19px; font-weight: 500; fill: #1e293b; }
      .section-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .section-subtitle { font-size: 9px; fill: #64748b; }
      .col-header { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .canvas-desc { font-size: 10px; fill: #334155; }
      .meta-text { font-size: 9.5px; fill: #334155; }
      
      /* Tarjetas de contenido */
      .box-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.2; rx: 3; ry: 3; }
      .box-yellow { fill: #fef08a; stroke: #fde047; stroke-width: 1.2; rx: 3; ry: 3; }
      .box-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1.2; rx: 3; ry: 3; }
      .box-purple { fill: #ede9fe; stroke: #c4b5fd; stroke-width: 1.2; rx: 3; ry: 3; }
      .box-dashed { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2.5, 2.5; rx: 3; ry: 3; }
      
      /* Textos interiores */
      .txt-title { font-size: 9px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .txt-sub { font-size: 8px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .txt-desc { font-size: 7px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(15, 12)">
    <!-- Marco Exterior -->
    <rect x="0" y="0" width="930" height="520" class="canvas-border" />
    
    <!-- ================= FILA 1: CABECERA ================= -->
    <line x1="0" y1="42" x2="930" y2="42" class="inner-line" />
    <text x="12" y="28" class="canvas-title">Name: <tspan class="canvas-name">Reservation Management</tspan></text>
    
    <!-- Meta info derecha -->
    <line x1="590" y1="0" x2="590" y2="42" class="inner-line" />
    <text x="605" y="18" class="meta-text" font-weight="700">V1.0</text>
    <text x="605" y="32" class="meta-text">Smart Stay – Bounded Context Canvas</text>
    
    <!-- Badge CC-BY -->
    <g transform="translate(825, 11)">
      <rect x="0" y="0" width="90" height="22" rx="3" fill="#000000" />
      <circle cx="22" cy="11" r="7" fill="none" stroke="#ffffff" stroke-width="1.3" />
      <text x="22" y="14" font-size="8.5" fill="#ffffff" font-weight="bold" text-anchor="middle">CC</text>
      <circle cx="50" cy="11" r="7" fill="none" stroke="#ffffff" stroke-width="1.3" />
      <circle cx="50" cy="8.5" r="2.2" fill="#ffffff" />
      <path d="M 46 16 C 46 12.5, 54 12.5, 54 16 Z" fill="#ffffff" />
      <text x="75" y="14" font-size="7.5" fill="#ffffff" font-weight="bold" text-anchor="middle">BY</text>
    </g>

    <!-- ================= FILA 2: METADATOS Y ROLES ================= -->
    <line x1="0" y1="150" x2="930" y2="150" class="inner-line" />
    <line x1="375" y1="42" x2="375" y2="150" class="inner-line" />
    <line x1="740" y1="42" x2="740" y2="150" class="inner-line" />

    <!-- Description -->
    <text x="12" y="62" class="section-title">Description</text>
    <text x="12" y="82" class="canvas-desc">Gestiona la creación, modificación, consulta y</text>
    <text x="12" y="96" class="canvas-desc">cancelación de reservas de habitaciones. Una reserva</text>
    <text x="12" y="110" class="canvas-desc">es un acuerdo entre el huésped y el hotel para asegurar</text>
    <text x="12" y="124" class="canvas-desc">la disponibilidad de una habitación en un período</text>
    <text x="12" y="138" class="canvas-desc">específico.</text>

    <!-- Strategic Classification -->
    <text x="390" y="62" class="section-title">Strategic Classification</text>
    <text x="390" y="86" class="meta-text" font-weight="700" fill="#64748b">Domain</text>
    <text x="390" y="120" class="meta-text" font-weight="700">Core</text>
    
    <text x="505" y="86" class="meta-text" font-weight="700" fill="#64748b">Business Model</text>
    <text x="505" y="120" class="meta-text" font-weight="700">Engagement</text>
    
    <text x="635" y="86" class="meta-text" font-weight="700" fill="#64748b">Evolution</text>
    <text x="635" y="120" class="meta-text" font-weight="700">Custom built</text>

    <!-- Domain Roles -->
    <text x="755" y="62" class="section-title">Domain Roles</text>
    <text x="755" y="90" class="meta-text" font-weight="700">Execution Context</text>
    <text x="755" y="120" class="meta-text" font-weight="700">Gateway Context</text>

    <!-- ================= FILA 3: COMUNICACIÓN Y DOMINIO ================= -->
    
    <!-- COLUMNA 1: INBOUND COMMUNICATION -->
    <text x="12" y="172" class="section-title">Inbound Communication</text>
    <text x="58" y="196" class="col-header">Collaborator</text>
    <text x="210" y="196" class="col-header">Messages</text>

    <!-- Inbound Row 1 -->
    <rect x="15" y="210" width="88" height="46" class="box-blue" />
    <text x="59" y="230" class="txt-title">Guest</text>
    <text x="59" y="243" class="txt-sub">(Mobile App)</text>
    
    <rect x="135" y="210" width="88" height="46" class="box-yellow" />
    <text x="179" y="237" class="txt-title">Crear Reserva</text>

    <!-- Inbound Row 2 -->
    <rect x="15" y="280" width="88" height="46" class="box-blue" />
    <text x="59" y="300" class="txt-title">Front Desk</text>
    <text x="59" y="313" class="txt-sub">(Staff App)</text>
    
    <rect x="135" y="280" width="88" height="46" class="box-yellow" />
    <text x="179" y="307" class="txt-title">Modificar Reserva</text>

    <rect x="235" y="280" width="88" height="46" class="box-green" />
    <text x="279" y="301" class="txt-title">Consultar Reserva</text>
    <text x="279" y="313" class="txt-title">por ID</text>

    <!-- Inbound Row 3 -->
    <rect x="15" y="350" width="88" height="46" class="box-blue" />
    <text x="59" y="369" class="txt-title">Payment</text>
    <text x="59" y="382" class="txt-sub">(Billing Context)</text>
    
    <rect x="135" y="350" width="88" height="46" class="box-yellow" />
    <text x="179" y="370" class="txt-title">Verificar Pago</text>
    <text x="179" y="382" class="txt-title">de Reserva</text>

    <rect x="235" y="350" width="88" height="46" class="box-green" />
    <text x="279" y="370" class="txt-title">Cancelar</text>
    <text x="279" y="382" class="txt-title">Reserva</text>


    <!-- COLUMNA 2: UBIQUITOUS LANGUAGE & BUSINESS DECISIONS -->
    <!-- Contenedor central formal -->
    <rect x="338" y="160" width="250" height="348" fill="#ffffff" stroke="#334155" stroke-width="1.2" rx="2" />
    
    <!-- Sub-sección: Ubiquitous Language -->
    <text x="463" y="178" class="section-title" text-anchor="middle">Ubiquitous Language</text>
    <text x="463" y="190" class="section-subtitle" text-anchor="middle">Context-specific domain terminology</text>

    <!-- Post-it: Reserva -->
    <rect x="410" y="200" width="106" height="34" class="box-dashed" />
    <text x="463" y="211" class="txt-title" style="font-size:8px;">Reserva</text>
    <text x="463" y="220" class="txt-desc">Acuerdo para asegurar una</text>
    <text x="463" y="228" class="txt-desc">habitación en un período determinado.</text>

    <!-- Post-it: Habitación -->
    <rect x="354" y="240" width="98" height="34" class="box-dashed" />
    <text x="403" y="251" class="txt-title" style="font-size:8px;">Habitación</text>
    <text x="403" y="260" class="txt-desc">Unidad física que puede</text>
    <text x="403" y="268" class="txt-desc">ser reservada.</text>

    <!-- Post-it: Huésped -->
    <rect x="474" y="240" width="98" height="34" class="box-dashed" />
    <text x="523" y="251" class="txt-title" style="font-size:8px;">Huésped</text>
    <text x="523" y="260" class="txt-desc">Persona que realiza</text>
    <text x="523" y="268" class="txt-desc">y posee la reserva.</text>

    <!-- Post-it: Estado de Reserva -->
    <rect x="372" y="280" width="182" height="34" class="box-dashed" />
    <text x="463" y="291" class="txt-title" style="font-size:8px;">Estado de Reserva</text>
    <text x="463" y="300" class="txt-desc">Situación actual de la reserva</text>
    <text x="463" y="308" class="txt-desc">(pendiente, confirmada, cancelada).</text>

    <!-- Sub-sección: Business Decisions -->
    <text x="463" y="335" class="section-title" text-anchor="middle">Business Decisions</text>
    <text x="463" y="347" class="section-subtitle" text-anchor="middle">Key business rules, policies, and decisions</text>

    <!-- Tarjetas de Reglas Lilas -->
    <rect x="349" y="358" width="110" height="42" class="box-purple" />
    <text x="404" y="372" class="txt-title" style="font-size:7.2px;">No se puede crear una reserva</text>
    <text x="404" y="382" class="txt-title" style="font-size:7.2px;">si no hay habitaciones</text>
    <text x="404" y="392" class="txt-title" style="font-size:7.2px;">disponibles.</text>

    <rect x="465" y="358" width="112" height="42" class="box-purple" />
    <text x="521" y="372" class="txt-title" style="font-size:7.2px;">Una reserva debe tener</text>
    <text x="521" y="382" class="txt-title" style="font-size:7.2px;">fechas de entrada y</text>
    <text x="521" y="392" class="txt-title" style="font-size:7.2px;">salida válidas.</text>

    <rect x="349" y="408" width="110" height="42" class="box-purple" />
    <text x="404" y="422" class="txt-title" style="font-size:7.2px;">Una reserva confirmada</text>
    <text x="404" y="432" class="txt-title" style="font-size:7.2px;">requiere un método de</text>
    <text x="404" y="442" class="txt-title" style="font-size:7.2px;">pago válido.</text>

    <rect x="465" y="408" width="112" height="42" class="box-purple" />
    <text x="521" y="422" class="txt-title" style="font-size:7.2px;">Una reserva cancelada</text>
    <text x="521" y="432" class="txt-title" style="font-size:7.2px;">puede tener políticas</text>
    <text x="521" y="442" class="txt-title" style="font-size:7.2px;">de penalización.</text>


    <!-- COLUMNA 3: OUTBOUND COMMUNICATION -->
    <text x="608" y="172" class="section-title">Outbound Communication</text>
    <text x="680" y="196" class="col-header">Messages</text>
    <text x="835" y="196" class="col-header">Collaborator</text>

    <!-- Outbound Row 1 -->
    <rect x="625" y="210" width="110" height="42" class="box-yellow" />
    <text x="680" y="228" class="txt-title">Reserva Creada</text>
    <text x="680" y="241" class="txt-sub">(Event)</text>
    
    <rect x="772" y="210" width="125" height="42" class="box-green" />
    <text x="834" y="228" class="txt-title">Check-In/Check-Out</text>
    <text x="834" y="240" class="txt-title">Management</text>

    <!-- Outbound Row 2 -->
    <rect x="625" y="268" width="110" height="42" class="box-yellow" />
    <text x="680" y="286" class="txt-title">Reserva Actualizada</text>
    <text x="680" y="299" class="txt-sub">(Event)</text>
    
    <rect x="772" y="268" width="125" height="42" class="box-green" />
    <text x="834" y="293" class="txt-title">Billing / Payments</text>

    <!-- Outbound Row 3 -->
    <rect x="625" y="326" width="110" height="42" class="box-yellow" />
    <text x="680" y="344" class="txt-title">Reserva Cancelada</text>
    <text x="680" y="357" class="txt-sub">(Event)</text>
    
    <rect x="772" y="326" width="125" height="42" class="box-green" />
    <text x="834" y="351" class="txt-title">Notification Service</text>

    <!-- Outbound Row 4 -->
    <rect x="625" y="384" width="110" height="42" class="box-yellow" />
    <text x="680" y="402" class="txt-title">Reserva Confirmada</text>
    <text x="680" y="415" class="txt-sub">(Event)</text>
    
    <rect x="772" y="384" width="125" height="42" class="box-green" />
    <text x="834" y="402" class="txt-title">Housekeeping</text>
    <text x="834" y="414" class="txt-title">Management</text>
  </g>
</svg>
