<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .canvas-border { fill: #ffffff; stroke: #1e293b; stroke-width: 2.5; }
      .inner-line { stroke: #334155; stroke-width: 1.5; fill: none; }
      
      /* Tipografía de encabezados y secciones */
      .canvas-title { font-size: 19px; font-weight: 800; fill: #0f172a; }
      .canvas-name { font-size: 19px; font-weight: 500; fill: #1e293b; }
      .section-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .section-subtitle { font-size: 9px; fill: #64748b; }
      .col-header { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .canvas-desc { font-size: 9.8px; fill: #334155; }
      .meta-text { font-size: 9.5px; fill: #334155; }
      
      /* Tarjetas delimitadas */
      .box-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.2; rx: 4; ry: 4; }
      .box-yellow { fill: #fef08a; stroke: #fde047; stroke-width: 1.2; rx: 4; ry: 4; }
      .box-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1.2; rx: 4; ry: 4; }
      .box-purple { fill: #ede9fe; stroke: #c4b5fd; stroke-width: 1.2; rx: 4; ry: 4; }
      .box-dashed { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2.5, 2.5; rx: 3; ry: 3; }
      
      /* Tipografía interior calibrada */
      .txt-title { font-size: 8.6px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .txt-sub { font-size: 7.6px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .txt-desc { font-size: 6.9px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(15, 12)">
    <!-- Marco Exterior General -->
    <rect x="0" y="0" width="930" height="524" class="canvas-border" />
    
    <!-- ================= FILA 1: CABECERA ================= -->
    <line x1="0" y1="42" x2="930" y2="42" class="inner-line" />
    <text x="12" y="28" class="canvas-title">Name: <tspan class="canvas-name">Guest Services</tspan></text>
    
    <line x1="600" y1="0" x2="600" y2="42" class="inner-line" />
    <text x="615" y="18" class="meta-text" font-weight="700">V1.0</text>
    <text x="615" y="32" class="meta-text">Smart Stay – Bounded Context Canvas</text>
    
    <!-- Badge CC-BY -->
    <g transform="translate(825, 11)">
      <rect x="0" y="0" width="90" height="22" rx="3" fill="#000000" />
      <circle cx="22" cy="11" r="7" fill="none" stroke="#ffffff" stroke-width="1.3" />
      <text x="22" y="14" font-size="8.5" fill="#ffffff" font-weight="bold" text-anchor="middle">CC</text>
      <circle cx="50" cy="11" r="7" fill="none" stroke="#ffffff" stroke-width="1.3" />
      <circle cx="50" cy="8.5" r="2.2" fill="#ffffff" />
      <path d="M 46 16 C 46 12.5, 54 12.5, 54 16 Z" fill="#ffffff" />
      <text x="75" y="14" font-size="7.5" fill="#ffffff" font-weight="bold" text-anchor="middle">BY</text>
    </g>

    <!-- ================= FILA 2: METADATOS Y ROLES ================= -->
    <line x1="0" y1="148" x2="930" y2="148" class="inner-line" />
    <line x1="375" y1="42" x2="375" y2="148" class="inner-line" />
    <line x1="740" y1="42" x2="740" y2="148" class="inner-line" />

    <!-- Description -->
    <text x="12" y="62" class="section-title">Description</text>
    <text x="12" y="81" class="canvas-desc">Gestiona las solicitudes de servicios y atención al huésped</text>
    <text x="12" y="94" class="canvas-desc">durante su estadía. Permite a los huéspedes solicitar</text>
    <text x="12" y="107" class="canvas-desc">servicios (room service, amenities, transporte, entre otros)</text>
    <text x="12" y="120" class="canvas-desc">y realizar consultas o reportes. Asegura que las solicitudes</text>
    <text x="12" y="133" class="canvas-desc">sean atendidas y brinda una comunicación efectiva entre</text>
    <text x="12" y="145" class="canvas-desc">huéspedes y el hotel.</text>

    <!-- Strategic Classification -->
    <text x="390" y="62" class="section-title">Strategic Classification</text>
    <text x="390" y="86" class="meta-text" font-weight="700" fill="#64748b">Domain</text>
    <text x="390" y="120" class="meta-text" font-weight="700">Core</text>
    
    <text x="505" y="86" class="meta-text" font-weight="700" fill="#64748b">Business Model</text>
    <text x="505" y="120" class="meta-text" font-weight="700">Engagement</text>
    
    <text x="635" y="86" class="meta-text" font-weight="700" fill="#64748b">Evolution</text>
    <text x="635" y="120" class="meta-text" font-weight="700">Custom built</text>

    <!-- Domain Roles -->
    <text x="755" y="62" class="section-title">Domain Roles</text>
    <text x="755" y="90" class="meta-text" font-weight="700">Execution Context</text>
    <text x="755" y="120" class="meta-text" font-weight="700">Gateway Context</text>

    <!-- ================= FILA 3: COMUNICACIÓN Y DOMINIO ================= -->

    <!-- COLUMNA 1: INBOUND COMMUNICATION -->
    <text x="12" y="168" class="section-title">Inbound Communication</text>
    <text x="58" y="190" class="col-header">Collaborator</text>
    <text x="210" y="190" class="col-header">Messages</text>

    <!-- Inbound Fila 1: Guest -->
    <rect x="15" y="202" width="88" height="38" class="box-blue" />
    <text x="59" y="219" class="txt-title">Guest</text>
    <text x="59" y="231" class="txt-sub">(Mobile App)</text>
    
    <rect x="125" y="202" width="92" height="38" class="box-yellow" />
    <text x="171" y="225" class="txt-title">Solicitar Servicio</text>

    <rect x="225" y="202" width="92" height="38" class="box-green" />
    <text x="271" y="220" class="txt-title">Consultar Estado</text>
    <text x="271" y="231" class="txt-title">del Servicio</text>

    <!-- Inbound Fila 2: Front Desk -->
    <rect x="15" y="252" width="88" height="38" class="box-blue" />
    <text x="59" y="269" class="txt-title">Front Desk</text>
    <text x="59" y="281" class="txt-sub">(Staff App)</text>
    
    <rect x="125" y="252" width="92" height="38" class="box-yellow" />
    <text x="171" y="269" class="txt-title">Registrar Solicitud</text>
    <text x="171" y="280" class="txt-title">para Huésped</text>

    <rect x="225" y="252" width="92" height="38" class="box-green" />
    <text x="271" y="269" class="txt-title">Actualizar Estado</text>
    <text x="271" y="280" class="txt-title">de Solicitud</text>

    <!-- Inbound Fila 3: Housekeeping Management -->
    <rect x="15" y="302" width="88" height="38" class="box-blue" />
    <text x="59" y="318" class="txt-title">Housekeeping</text>
    <text x="59" y="329" class="txt-sub">Management</text>
    
    <rect x="125" y="302" width="92" height="38" class="box-yellow" />
    <text x="171" y="318" class="txt-title">Notificar Servicio</text>
    <text x="171" y="329" class="txt-title">Completado</text>

    <rect x="225" y="302" width="92" height="38" class="box-green" />
    <text x="271" y="318" class="txt-title">Consultar</text>
    <text x="271" y="329" class="txt-title">Solicitudes</text>

    <!-- Inbound Fila 4: Maintenance Management -->
    <rect x="15" y="352" width="88" height="38" class="box-blue" />
    <text x="59" y="368" class="txt-title">Maintenance</text>
    <text x="59" y="379" class="txt-sub">Management</text>
    
    <rect x="125" y="352" width="92" height="38" class="box-yellow" />
    <text x="171" y="368" class="txt-title">Reportar Problema</text>
    <text x="171" y="379" class="txt-title">desde Servicio</text>

    <rect x="225" y="352" width="92" height="38" class="box-green" />
    <text x="271" y="368" class="txt-title">Consultar Estado</text>
    <text x="271" y="379" class="txt-title">de Atención</text>

    <!-- Inbound Fila 5: IAM -->
    <rect x="15" y="402" width="88" height="38" class="box-blue" />
    <text x="59" y="418" class="txt-title">IAM</text>
    <text x="59" y="429" class="txt-sub">(Identity Context)</text>
    
    <rect x="125" y="402" width="92" height="38" class="box-yellow" />
    <text x="171" y="418" class="txt-title">Validar Permisos</text>
    <text x="171" y="429" class="txt-title">de Usuario</text>

    <rect x="225" y="402" width="92" height="38" class="box-green" />
    <text x="271" y="418" class="txt-title">Obtener Datos</text>
    <text x="271" y="429" class="txt-title">del Usuario</text>


    <!-- COLUMNA 2: UBIQUITOUS LANGUAGE & BUSINESS DECISIONS -->
    <rect x="338" y="156" width="254" height="354" fill="#ffffff" stroke="#334155" stroke-width="1.2" rx="3" />
    
    <!-- Subsección: Ubiquitous Language -->
    <text x="465" y="174" class="section-title" text-anchor="middle">Ubiquitous Language</text>
    <text x="465" y="185" class="section-subtitle" text-anchor="middle">Context-specific domain terminology</text>

    <!-- Solicitud de Servicio -->
    <rect x="390" y="193" width="150" height="32" class="box-dashed" />
    <text x="465" y="204" class="txt-title" style="font-size:7.8px;">Solicitud de Servicio</text>
    <text x="465" y="213" class="txt-desc">Petición realizada por el huésped</text>
    <text x="465" y="221" class="txt-desc">para recibir un servicio específico.</text>

    <!-- Servicio & Estado de Servicio -->
    <rect x="348" y="230" width="112" height="37" class="box-dashed" />
    <text x="404" y="242" class="txt-title" style="font-size:8px;">Servicio</text>
    <text x="404" y="251" class="txt-desc">Tipo de servicio que puede</text>
    <text x="404" y="259" class="txt-desc">ser solicitado por el huésped.</text>

    <rect x="468" y="230" width="114" height="37" class="box-dashed" />
    <text x="525" y="241" class="txt-title" style="font-size:7.6px;">Estado de Servicio</text>
    <text x="525" y="250" class="txt-desc">Situación actual de la solicitud</text>
    <text x="525" y="257" class="txt-desc">(pendiente, en proceso,</text>
    <text x="525" y="264" class="txt-desc">completado, cancelado).</text>

    <!-- Huésped & Proveedor de Servicio -->
    <rect x="348" y="272" width="112" height="37" class="box-dashed" />
    <text x="404" y="284" class="txt-title" style="font-size:8px;">Huésped</text>
    <text x="404" y="293" class="txt-desc">Persona que solicita</text>
    <text x="404" y="301" class="txt-desc">un servicio durante su estadía.</text>

    <rect x="468" y="272" width="114" height="37" class="box-dashed" />
    <text x="525" y="283" class="txt-title" style="font-size:7.4px;">Proveedor de Servicio</text>
    <text x="525" y="292" class="txt-desc">Departamento o personal</text>
    <text x="525" y="299" class="txt-desc">responsable de atender</text>
    <text x="525" y="306" class="txt-desc">la solicitud.</text>

    <!-- Subsección: Business Decisions -->
    <text x="465" y="328" class="section-title" text-anchor="middle">Business Decisions</text>
    <text x="465" y="340" class="section-subtitle" text-anchor="middle">Key business rules, policies, and decisions</text>

    <!-- Reglas de Negocio (Lilas) -->
    <rect x="348" y="350" width="112" height="40" class="box-purple" />
    <text x="404" y="363" class="txt-title" style="font-size:6.8px;">Una solicitud de servicio debe</text>
    <text x="404" y="372" class="txt-title" style="font-size:6.8px;">ser creada con información</text>
    <text x="404" y="381" class="txt-title" style="font-size:6.8px;">mínima obligatoria.</text>

    <rect x="468" y="350" width="114" height="40" class="box-purple" />
    <text x="525" y="363" class="txt-title" style="font-size:6.8px;">El estado del servicio debe</text>
    <text x="525" y="372" class="txt-title" style="font-size:6.8px;">actualizarse en tiempo real</text>
    <text x="525" y="381" class="txt-title" style="font-size:6.8px;">hasta su finalización.</text>

    <rect x="348" y="396" width="112" height="42" class="box-purple" />
    <text x="404" y="409" class="txt-title" style="font-size:6.8px;">Las solicitudes de servicio</text>
    <text x="404" y="418" class="txt-title" style="font-size:6.8px;">tienen prioridad según su tipo</text>
    <text x="404" y="427" class="txt-title" style="font-size:6.8px;">y urgencia.</text>

    <rect x="468" y="396" width="114" height="42" class="box-purple" />
    <text x="525" y="409" class="txt-title" style="font-size:6.8px;">El huésped debe recibir</text>
    <text x="525" y="418" class="txt-title" style="font-size:6.8px;">notificación cuando su solicitud</text>
    <text x="525" y="427" class="txt-title" style="font-size:6.8px;">sea completada o cancelada.</text>


    <!-- COLUMNA 3: OUTBOUND COMMUNICATION -->
    <text x="608" y="168" class="section-title">Outbound Communication</text>
    <text x="680" y="190" class="col-header">Messages</text>
    <text x="835" y="190" class="col-header">Collaborator</text>

    <!-- Outbound Fila 1 -->
    <rect x="618" y="202" width="124" height="38" class="box-yellow" />
    <text x="680" y="219" class="txt-title">Solicitud de Servicio</text>
    <text x="680" y="230" class="txt-sub">Registrada (Event)</text>
    
    <rect x="758" y="202" width="134" height="38" class="box-green" />
    <text x="825" y="219" class="txt-title">Housekeeping</text>
    <text x="825" y="230" class="txt-title">Management</text>

    <!-- Outbound Fila 2 -->
    <rect x="618" y="252" width="124" height="38" class="box-yellow" />
    <text x="680" y="269" class="txt-title">Estado de Servicio</text>
    <text x="680" y="280" class="txt-sub">Actualizado (Event)</text>
    
    <rect x="758" y="252" width="134" height="38" class="box-green" />
    <text x="825" y="269" class="txt-title">Maintenance</text>
    <text x="825" y="280" class="txt-title">Management</text>

    <!-- Outbound Fila 3 -->
    <rect x="618" y="302" width="124" height="38" class="box-yellow" />
    <text x="680" y="318" class="txt-title">Servicio Completado</text>
    <text x="680" y="329" class="txt-sub">(Event)</text>
    
    <rect x="758" y="302" width="134" height="38" class="box-green" />
    <text x="825" y="324" class="txt-title">Notification Service</text>

    <!-- Outbound Fila 4 -->
    <rect x="618" y="352" width="124" height="38" class="box-yellow" />
    <text x="680" y="368" class="txt-title">Servicio Cancelado</text>
    <text x="680" y="379" class="txt-sub">(Event)</text>
    
    <rect x="758" y="352" width="134" height="38" class="box-green" />
    <text x="825" y="368" class="txt-title">Front Desk</text>
    <text x="825" y="379" class="txt-sub">(Staff App)</text>

    <!-- Outbound Fila 5 -->
    <rect x="618" y="402" width="124" height="38" class="box-yellow" />
    <text x="680" y="418" class="txt-title">Notificación al Huésped</text>
    <text x="680" y="429" class="txt-sub">(Event)</text>
    
    <rect x="758" y="402" width="134" height="38" class="box-green" />
    <text x="825" y="418" class="txt-title">Guest</text>
    <text x="825" y="429" class="txt-sub">(Mobile App)</text>
  </g>
</svg>
