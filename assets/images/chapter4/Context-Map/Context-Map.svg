<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filtro de sombra suave para elevación profesional -->
    <filter id="card-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <style>
      /* Borde y lienzo general */
      .canvas-frame { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      
      /* Líneas de conexión entre contextos */
      .context-edge { stroke: #475569; stroke-width: 1.5; fill: none; }
      
      /* Nodos de Bounded Context (Elipses formales) */
      .bc-node { fill: #ffffff; stroke: #1e293b; stroke-width: 1.8; filter: url(#card-shadow); }
      .bc-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      
      /* Etiquetas delimitadas de patrones de relación (Customer-Supplier, Conformist) */
      .pill-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 5; ry: 5; }
      .pill-text { font-size: 10.5px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      
      /* Badges Upstream (U) / Downstream (D) */
      .badge-circle { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; }
      .badge-letter { font-size: 9.5px; font-weight: 800; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      
      /* Componente Anti-Corruption Layer (ACL) */
      .acl-box { fill: #ffffff; stroke: #0f172a; stroke-width: 1.8; rx: 3; ry: 3; filter: url(#card-shadow); }
      .acl-text { font-size: 11px; font-weight: 800; fill: #0f172a; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; }

      /* Cuadro de leyenda */
      .legend-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .legend-title { font-size: 10px; font-weight: 700; fill: #334155; }
      .legend-text { font-size: 9px; fill: #64748b; }
    </style>
  </defs>

  <!-- Marco Exterior General -->
  <rect x="15" y="15" width="930" height="690" class="canvas-frame" />

  <!-- ======================================================================
       LÍNEAS DE INTEGRACIÓN Y CONEXIONES (CAPA INFERIOR)
       ====================================================================== -->

  <!-- Conexión: IAM <-> Profiles (con ACL) -->
  <line x1="840" y1="130" x2="550" y2="130" class="context-edge" />

  <!-- Conexión: Profiles <-> Bookings & Payments (Conformist) -->
  <line x1="550" y1="130" x2="550" y2="355" class="context-edge" />

  <!-- Conexión: Properties Management <-> Operational Tasks (Customer-Supplier) -->
  <line x1="220" y1="200" x2="180" y2="420" class="context-edge" />

  <!-- Conexión: Properties Management <-> Bookings & Payments (Customer-Supplier) -->
  <line x1="220" y1="200" x2="550" y2="355" class="context-edge" />

  <!-- Conexión: Operational Tasks <-> Bookings & Payments (Customer-Supplier) -->
  <line x1="180" y1="420" x2="550" y2="355" class="context-edge" />

  <!-- Conexión: Bookings & Payments <-> IoT Stay & Experience (Customer-Supplier) -->
  <line x1="550" y1="355" x2="200" y2="610" class="context-edge" />

  <!-- Conexión: Bookings & Payments <-> Analytics (con ACL) -->
  <line x1="550" y1="355" x2="840" y2="355" class="context-edge" />


  <!-- ======================================================================
       BLOQUES ACL (ANTI-CORRUPTION LAYER)
       ====================================================================== -->

  <!-- ACL: Entre Profiles e IAM -->
  <g transform="translate(685, 110)">
    <rect x="0" y="0" width="30" height="40" class="acl-box" />
    <text x="15" y="20" class="acl-text">ACL</text>
  </g>

  <!-- ACL: Entre Bookings & Payments y Analytics -->
  <g transform="translate(685, 335)">
    <rect x="0" y="0" width="30" height="40" class="acl-box" />
    <text x="15" y="20" class="acl-text">ACL</text>
  </g>


  <!-- ======================================================================
       ETIQUETAS DELIMITADAS DE RELACIÓN (PILLS PROTECTORAS)
       ====================================================================== -->

  <!-- Label: Conformist (Profiles -> Bookings) -->
  <g transform="translate(515, 230)">
    <rect x="0" y="0" width="70" height="20" class="pill-box" />
    <text x="35" y="14" class="pill-text">Conformist</text>
  </g>

  <!-- Label: Customer-Supplier (Properties -> Operational Tasks) -->
  <g transform="translate(142, 298)">
    <rect x="0" y="0" width="112" height="20" class="pill-box" />
    <text x="56" y="14" class="pill-text">Customer-Supplier</text>
  </g>

  <!-- Label: Customer-Supplier (Properties -> Bookings) -->
  <g transform="translate(330, 267)">
    <rect x="0" y="0" width="112" height="20" class="pill-box" />
    <text x="56" y="14" class="pill-text">Customer-Supplier</text>
  </g>

  <!-- Label: Customer-Supplier (Operational Tasks -> Bookings) -->
  <g transform="translate(315, 377)">
    <rect x="0" y="0" width="112" height="20" class="pill-box" />
    <text x="56" y="14" class="pill-text">Customer-Supplier</text>
  </g>

  <!-- Label: Customer-Supplier (Bookings -> IoT Stay) -->
  <g transform="translate(320, 470)">
    <rect x="0" y="0" width="112" height="20" class="pill-box" />
    <text x="56" y="14" class="pill-text">Customer-Supplier</text>
  </g>


  <!-- ======================================================================
       INDICADORES UPSTREAM (U) Y DOWNSTREAM (D)
       ====================================================================== -->

  <!-- IAM (U) <-> (D) ACL (Profiles) -->
  <g transform="translate(755, 130)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">U</text>
  </g>
  <g transform="translate(660, 130)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">D</text>
  </g>

  <!-- Profiles (U) <-> (D) Bookings & Payments -->
  <g transform="translate(550, 185)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">U</text>
  </g>
  <g transform="translate(550, 298)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">D</text>
  </g>

  <!-- Properties (U) <-> (D) Operational Tasks -->
  <g transform="translate(210, 255)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">U</text>
  </g>
  <g transform="translate(190, 365)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">D</text>
  </g>

  <!-- Properties (U) <-> (D) Bookings & Payments -->
  <g transform="translate(295, 236)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">U</text>
  </g>
  <g transform="translate(485, 326)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">D</text>
  </g>

  <!-- Bookings (U) <-> (D) Operational Tasks -->
  <g transform="translate(250, 408)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">D</text>
  </g>
  <g transform="translate(470, 370)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">U</text>
  </g>

  <!-- Bookings (U) <-> (D) IoT Stay & Experience -->
  <g transform="translate(500, 392)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">U</text>
  </g>
  <g transform="translate(255, 570)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">D</text>
  </g>

  <!-- Bookings (U) <-> (D) ACL (Analytics) -->
  <g transform="translate(635, 355)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">U</text>
  </g>
  <g transform="translate(735, 355)">
    <circle cx="0" cy="0" r="8" class="badge-circle" />
    <text x="0" y="0" class="badge-letter">D</text>
  </g>


  <!-- ======================================================================
       NODOS DE BOUNDED CONTEXTS (ELIPSES DELIMITADAS)
       ====================================================================== -->

  <!-- Context: IAM -->
  <g transform="translate(840, 130)">
    <ellipse cx="0" cy="0" rx="68" ry="42" class="bc-node" />
    <text x="0" y="4" class="bc-title">IAM</text>
  </g>

  <!-- Context: Profiles -->
  <g transform="translate(550, 130)">
    <ellipse cx="0" cy="0" rx="68" ry="42" class="bc-node" />
    <text x="0" y="4" class="bc-title">Profiles</text>
  </g>

  <!-- Context: Properties Management -->
  <g transform="translate(220, 200)">
    <ellipse cx="0" cy="0" rx="68" ry="42" class="bc-node" />
    <text x="0" y="-3" class="bc-title">Properties</text>
    <text x="0" y="13" class="bc-title">Management</text>
  </g>

  <!-- Context: Bookings & Payments -->
  <g transform="translate(550, 355)">
    <ellipse cx="0" cy="0" rx="72" ry="45" class="bc-node" />
    <text x="0" y="-3" class="bc-title">Bookings &amp;</text>
    <text x="0" y="13" class="bc-title">Payments</text>
  </g>

  <!-- Context: Analytics -->
  <g transform="translate(840, 355)">
    <ellipse cx="0" cy="0" rx="68" ry="42" class="bc-node" />
    <text x="0" y="4" class="bc-title">Analytics</text>
  </g>

  <!-- Context: Operational Tasks -->
  <g transform="translate(180, 420)">
    <ellipse cx="0" cy="0" rx="68" ry="42" class="bc-node" />
    <text x="0" y="4" class="bc-title">Operational Tasks</text>
  </g>

  <!-- Context: IoT Stay & Experience -->
  <g transform="translate(200, 610)">
    <ellipse cx="0" cy="0" rx="70" ry="44" class="bc-node" />
    <text x="0" y="-3" class="bc-title">IoT Stay &amp;</text>
    <text x="0" y="13" class="bc-title">Experience</text>
  </g>


  <!-- ======================================================================
       LEYENDA TÉCNICA ESTRUCTURADA
       ====================================================================== -->
  <g transform="translate(740, 585)">
    <rect x="0" y="0" width="185" height="100" class="legend-bg" />
    <text x="12" y="18" class="legend-title">Context Mapping Legend</text>
    
    <!-- U / D -->
    <circle cx="20" cy="35" r="7" class="badge-circle" />
    <text x="20" y="35" class="badge-letter" style="font-size:8px;">U</text>
    <text x="35" y="38" class="legend-text"><strong>Upstream</strong> (Proveedor)</text>

    <circle cx="20" cy="54" r="7" class="badge-circle" />
    <text x="20" y="54" class="badge-letter" style="font-size:8px;">D</text>
    <text x="35" y="57" class="legend-text"><strong>Downstream</strong> (Consumidor)</text>

    <!-- ACL -->
    <rect x="13" y="70" width="16" height="18" class="acl-box" />
    <text x="21" y="80" class="acl-text" style="font-size:7px;">ACL</text>
    <text x="35" y="81" class="legend-text"><strong>Anti-Corruption Layer</strong></text>
  </g>
</svg>
