<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1020" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcador de flecha para líneas punteadas -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#555" />
    </marker>
    <style>
      .panel-border { fill: #ffffff; stroke: #7b4397; stroke-width: 1.5; }
      .scenario-title { font-size: 16px; font-weight: bold; fill: #222; }
      .label-title { font-size: 11px; font-weight: bold; fill: #111; text-anchor: middle; }
      .label-sub { font-size: 9.5px; fill: #555; text-anchor: middle; }
      .flow-line { stroke: #666; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      
      /* Estilos de nodos según leyenda */
      .box-cmd { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.2; rx: 3; ry: 3; }
      .text-cmd { font-size: 9.5px; font-weight: bold; fill: #1e3a8a; text-anchor: middle; }
      
      .box-event { fill: #fef08a; stroke: #fde047; stroke-width: 1.2; rx: 3; ry: 3; }
      .text-event { font-size: 9.5px; font-weight: bold; fill: #713f12; text-anchor: middle; }
      
      .shape-bc { fill: #e9d5ff; stroke: #c084fc; stroke-width: 1.5; }
      .text-bc { font-size: 10.5px; font-weight: bold; fill: #4c1d95; text-anchor: middle; }
      
      .shape-ext { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
      .text-ext { font-size: 10px; font-weight: bold; fill: #374151; text-anchor: middle; }
    </style>
  </defs>

  <!-- ==========================================
       SCENARIO 01: CREATE NEW RESERVATION
       ========================================== -->
  <rect x="25" y="20" width="900" height="420" rx="4" class="panel-border" />
  <text x="45" y="45" class="scenario-title">Scenario 01: Create New Reservation</text>

  <!-- Actor: Guest -->
  <circle cx="95" cy="225" r="14" fill="#111" />
  <path d="M 75 260 C 75 242, 115 242, 115 260 Z" fill="#111" />
  <text x="95" y="280" class="label-title">Guest</text>
  <text x="95" y="293" class="label-sub">(Mobile App User)</text>

  <!-- Flow Guest -> App -->
  <line x1="115" y1="245" x2="280" y2="245" class="flow-line" marker-end="url(#arrow)" />
  <rect x="145" y="205" width="80" height="42" class="box-cmd" />
  <text x="185" y="222" class="text-cmd">1. Create</text>
  <text x="185" y="233" class="text-cmd">Reservation</text>
  <text x="185" y="244" class="text-cmd">(Command)</text>

  <!-- External System: Smart Stay Mobile App -->
  <circle cx="315" cy="245" r="22" class="shape-ext" />
  <text x="315" y="285" class="label-title">Smart Stay Mobile App</text>
  <text x="315" y="298" class="label-sub">(Flutter)</text>

  <!-- Flow App -> Reservation Management -->
  <line x1="345" y1="240" x2="495" y2="205" class="flow-line" marker-end="url(#arrow)" />
  <rect x="365" y="190" width="80" height="42" class="box-cmd" />
  <text x="405" y="207" class="text-cmd">1. Send</text>
  <text x="405" y="218" class="text-cmd">Reservation</text>
  <text x="405" y="229" class="text-cmd">(Command)</text>

  <!-- Bounded Context: Reservation Management -->
  <ellipse cx="545" cy="200" rx="60" ry="36" class="shape-bc" />
  <text x="545" y="197" class="text-bc">Reservation</text>
  <text x="545" y="210" class="text-bc">Management</text>

  <!-- Internal Event: Reservation Created -->
  <line x1="545" y1="164" x2="555" y2="120" class="flow-line" marker-end="url(#arrow)" />
  <rect x="560" y="70" width="88" height="45" class="box-event" />
  <text x="604" y="87" class="text-event">2. Reservation</text>
  <text x="604" y="99" class="text-event">Created</text>
  <text x="604" y="110" class="text-event">(Event)</text>

  <!-- Flow: Reservation Management -> Room Availability -->
  <line x1="605" y1="200" x2="775" y2="200" class="flow-line" marker-end="url(#arrow)" />
  <rect x="670" y="145" width="90" height="45" class="box-event" />
  <text x="715" y="162" class="text-event">2. Update Room</text>
  <text x="715" y="174" class="text-event">Availability</text>
  <text x="715" y="185" class="text-event">(Event)</text>

  <!-- Bounded Context: Room Availability -->
  <ellipse cx="825" cy="200" rx="46" ry="30" class="shape-bc" />
  <text x="825" y="197" class="text-bc">Room</text>
  <text x="825" y="210" class="text-bc">Availability</text>

  <!-- Flow: Reservation Management -> Notification Service -->
  <line x1="590" y1="225" x2="695" y2="370" class="flow-line" marker-end="url(#arrow)" />
  <rect x="650" y="255" width="70" height="52" class="box-cmd" />
  <text x="685" y="271" class="text-cmd">3. Notify</text>
  <text x="685" y="282" class="text-cmd">Reservation</text>
  <text x="685" y="293" class="text-cmd">Created</text>
  <text x="685" y="303" class="text-cmd">(Command)</text>

  <!-- External System: Notification Service -->
  <circle cx="710" cy="375" r="22" class="shape-ext" />
  <text x="710" y="415" class="label-title">Notification Service</text>
  <text x="710" y="427" class="label-sub">(Email / Push)</text>

  <!-- Flow: Notification Service -> Smart Stay Mobile App -->
  <path d="M 685 375 L 420 375 L 360 305" class="flow-line" marker-end="url(#arrow)" />
  <rect x="475" y="388" width="85" height="42" class="box-event" />
  <text x="517" y="405" class="text-event">4. Confirmation</text>
  <text x="517" y="416" class="text-event">Sent</text>
  <text x="517" y="426" class="text-event">(Event)</text>


  <!-- ==========================================
       SCENARIO 02: DIGITAL CHECK-IN
       ========================================== -->
  <rect x="25" y="470" width="900" height="525" rx="4" class="panel-border" />
  <text x="45" y="495" class="scenario-title">Scenario 02: Digital Check-In</text>

  <!-- Actor: Guest -->
  <circle cx="95" cy="690" r="14" fill="#111" />
  <path d="M 75 725 C 75 707, 115 707, 115 725 Z" fill="#111" />
  <text x="95" y="745" class="label-title">Guest</text>
  <text x="95" y="758" class="label-sub">(Mobile App User)</text>

  <!-- Flow Guest -> App -->
  <line x1="115" y1="710" x2="255" y2="710" class="flow-line" marker-end="url(#arrow)" />
  <rect x="145" y="670" width="85" height="42" class="box-cmd" />
  <text x="187" y="687" class="text-cmd">1. Start</text>
  <text x="187" y="698" class="text-cmd">Digital Check-In</text>
  <text x="187" y="709" class="text-cmd">(Command)</text>

  <!-- External System: Smart Stay Mobile App -->
  <circle cx="280" cy="710" r="22" class="shape-ext" />
  <text x="280" y="750" class="label-title">Smart Stay Mobile App</text>
  <text x="280" y="763" class="label-sub">(Flutter)</text>

  <!-- Flow App -> Check-In Management -->
  <line x1="310" y1="710" x2="445" y2="710" class="flow-line" marker-end="url(#arrow)" />
  <rect x="340" y="670" width="80" height="42" class="box-cmd" />
  <text x="380" y="687" class="text-cmd">1. Validate</text>
  <text x="380" y="698" class="text-cmd">Guest Data</text>
  <text x="380" y="709" class="text-cmd">(Query)</text>

  <!-- Bounded Context: Check-In / Check-Out Management -->
  <ellipse cx="505" cy="710" rx="60" ry="36" class="shape-bc" />
  <text x="505" y="700" class="text-bc">Check-In /</text>
  <text x="505" y="712" class="text-bc">Check-Out</text>
  <text x="505" y="724" class="text-bc">Management</text>

  <!-- Flow Check-In -> Room Assignment -->
  <line x1="505" y1="674" x2="535" y2="580" class="flow-line" marker-end="url(#arrow)" />
  <line x1="540" y1="580" x2="675" y2="580" class="flow-line" marker-end="url(#arrow)" />
  <rect x="545" y="555" width="75" height="42" class="box-event" />
  <text x="582" y="572" class="text-event">2. Check-In</text>
  <text x="582" y="583" class="text-event">Completed</text>
  <text x="582" y="593" class="text-event">(Event)</text>

  <!-- Bounded Context: Room Assignment -->
  <ellipse cx="715" cy="580" rx="46" ry="28" class="shape-bc" />
  <text x="715" y="577" class="text-bc">Room</text>
  <text x="715" y="589" class="text-bc">Assignment</text>

  <!-- Event from Room Assignment -->
  <line x1="715" y1="608" x2="715" y2="640" class="flow-line" marker-end="url(#arrow)" />
  <rect x="680" y="640" width="70" height="42" class="box-event" />
  <text x="715" y="657" class="text-event">3. Room</text>
  <text x="715" y="668" class="text-event">Assigned</text>
  <text x="715" y="678" class="text-event">(Event)</text>

  <!-- Flow Check-In -> Notification Service -->
  <line x1="565" y1="720" x2="685" y2="735" class="flow-line" marker-end="url(#arrow)" />
  <rect x="575" y="700" width="75" height="42" class="box-cmd" />
  <text x="612" y="715" class="text-cmd">2. Notify</text>
  <text x="612" y="726" class="text-cmd">Operational Staff</text>
  <text x="612" y="736" class="text-cmd">(Command)</text>

  <!-- External System: Notification Service -->
  <circle cx="715" cy="735" r="22" class="shape-ext" />
  <text x="715" y="775" class="label-title">Notification Service</text>
  <text x="715" y="787" class="label-sub">(Email / Push)</text>

  <!-- Event to Staff Notified -->
  <line x1="737" y1="735" x2="800" y2="735" class="flow-line" marker-end="url(#arrow)" />
  <rect x="800" y="715" width="60" height="42" class="box-event" />
  <text x="830" y="732" class="text-event">4. Staff</text>
  <text x="830" y="743" class="text-event">Notified</text>
  <text x="830" y="753" class="text-event">(Event)</text>

  <!-- Flow Check-In -> Housekeeping Management -->
  <line x1="505" y1="746" x2="505" y2="870" class="flow-line" marker-end="url(#arrow)" />
  <rect x="470" y="775" width="70" height="42" class="box-cmd" />
  <text x="505" y="792" class="text-cmd">3. Update</text>
  <text x="505" y="802" class="text-cmd">Room Status</text>
  <text x="505" y="812" class="text-cmd">(Command)</text>

  <!-- Bounded Context: Housekeeping Management -->
  <ellipse cx="505" cy="900" rx="50" ry="30" class="shape-bc" />
  <text x="505" y="897" class="text-bc">Housekeeping</text>
  <text x="505" y="909" class="text-bc">Management</text>

  <!-- Flow Housekeeping -> Room Availability -->
  <line x1="555" y1="900" x2="675" y2="900" class="flow-line" marker-end="url(#arrow)" />
  <rect x="580" y="880" width="75" height="42" class="box-event" />
  <text x="617" y="897" class="text-event">5. Room Status</text>
  <text x="617" y="908" class="text-event">Updated</text>
  <text x="617" y="918" class="text-event">(Event)</text>

  <!-- Bounded Context: Room Availability (Scenario 2) -->
  <ellipse cx="725" cy="900" rx="46" ry="28" class="shape-bc" />
  <text x="725" y="897" class="text-bc">Room</text>
  <text x="725" y="909" class="text-bc">Availability</text>

  <!-- Event Availability Updated -->
  <line x1="771" y1="900" x2="810" y2="900" class="flow-line" marker-end="url(#arrow)" />
  <rect x="810" y="880" width="65" height="42" class="box-event" />
  <text x="842" y="897" class="text-event">6. Availability</text>
  <text x="842" y="908" class="text-event">Updated</text>
  <text x="842" y="918" class="text-event">(Event)</text>


  <!-- ==========================================
       LEGEND
       ========================================== -->
  <rect x="45" y="830" width="165" height="120" rx="3" stroke="#999" stroke-width="1" stroke-dasharray="3,3" fill="#fff" />
  <text x="55" y="848" style="font-size:11px; font-weight:bold; fill:#333;">Legend</text>

  <rect x="55" y="858" width="16" height="10" class="box-cmd" />
  <text x="78" y="867" style="font-size:9px; fill:#333;">Command / Query</text>

  <rect x="55" y="878" width="16" height="10" class="box-event" />
  <text x="78" y="887" style="font-size:9px; fill:#333;">Event</text>

  <ellipse cx="63" cy="907" rx="8" ry="6" class="shape-bc" />
  <text x="78" y="910" style="font-size:9px; fill:#333;">Bounded Context</text>

  <circle cx="63" cy="930" r="7" class="shape-ext" />
  <text x="78" y="933" style="font-size:9px; fill:#333;">External System / Service</text>
</svg>
