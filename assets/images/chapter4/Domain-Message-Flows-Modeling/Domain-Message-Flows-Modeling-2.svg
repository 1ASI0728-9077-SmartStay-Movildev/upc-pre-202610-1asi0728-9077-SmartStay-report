<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcador de flecha para las conexiones punteadas -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#555" />
    </marker>
    <style>
      .panel-border { fill: #ffffff; stroke: #7b4397; stroke-width: 1.5; }
      .scenario-title { font-size: 16px; font-weight: bold; fill: #222; }
      .label-title { font-size: 11px; font-weight: bold; fill: #111; text-anchor: middle; }
      .label-sub { font-size: 9.5px; fill: #555; text-anchor: middle; }
      .flow-line { stroke: #666; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      
      .box-cmd { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.2; rx: 3; ry: 3; }
      .text-cmd { font-size: 9.5px; font-weight: bold; fill: #1e3a8a; text-anchor: middle; }
      
      .box-event { fill: #fef08a; stroke: #fde047; stroke-width: 1.2; rx: 3; ry: 3; }
      .text-event { font-size: 9.5px; font-weight: bold; fill: #713f12; text-anchor: middle; }
      
      .shape-bc { fill: #e9d5ff; stroke: #c084fc; stroke-width: 1.5; }
      .text-bc { font-size: 10.5px; font-weight: bold; fill: #4c1d95; text-anchor: middle; }
      
      .shape-ext { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
      .text-ext { font-size: 10px; font-weight: bold; fill: #374151; text-anchor: middle; }
    </style>
  </defs>

  <!-- ==========================================
       SCENARIO 05: REPORT MAINTENANCE ISSUE
       ========================================== -->
  <rect x="25" y="20" width="900" height="500" rx="4" class="panel-border" />
  <text x="45" y="48" class="scenario-title">Scenario 05: Report Maintenance Issue</text>

  <!-- Actor: Operational Staff -->
  <circle cx="85" cy="200" r="14" fill="#111" />
  <path d="M 65 235 C 65 217, 105 217, 105 235 Z" fill="#111" />
  <text x="85" y="255" class="label-title">Operational Staff</text>
  <text x="85" y="268" class="label-sub">(Mobile App User)</text>

  <!-- Flow: Staff -> App -->
  <line x1="105" y1="220" x2="245" y2="220" class="flow-line" marker-end="url(#arrow)" />
  <rect x="135" y="180" width="85" height="42" class="box-cmd" />
  <text x="177" y="197" class="text-cmd">1. Report</text>
  <text x="177" y="208" class="text-cmd">Maintenance Issue</text>
  <text x="177" y="219" class="text-cmd">(Command)</text>

  <!-- External System: Smart Stay Mobile App (Android) -->
  <circle cx="270" cy="220" r="22" class="shape-ext" />
  <text x="270" y="258" class="label-title">Smart Stay Mobile App</text>
  <text x="270" y="270" class="label-sub">(Android)</text>

  <!-- Flow: App -> Maintenance Management -->
  <line x1="295" y1="220" x2="435" y2="220" class="flow-line" marker-end="url(#arrow)" />
  <rect x="325" y="180" width="95" height="42" class="box-cmd" />
  <text x="372" y="197" class="text-cmd">1. Send Maintenance</text>
  <text x="372" y="208" class="text-cmd">Issue Report</text>
  <text x="372" y="219" class="text-cmd">(Command)</text>

  <!-- Bounded Context: Maintenance Management -->
  <ellipse cx="495" cy="220" rx="55" ry="35" class="shape-bc" />
  <text x="495" y="217" class="text-bc">Maintenance</text>
  <text x="495" y="229" class="text-bc">Management</text>

  <!-- Flow: Maintenance -> Room Availability -->
  <line x1="495" y1="185" x2="510" y2="105" class="flow-line" marker-end="url(#arrow)" />
  <line x1="510" y1="105" x2="690" y2="105" class="flow-line" marker-end="url(#arrow)" />
  <rect x="520" y="75" width="110" height="42" class="box-event" />
  <text x="575" y="92" class="text-event">2. Maintenance Issue</text>
  <text x="575" y="103" class="text-event">Registered</text>
  <text x="575" y="113" class="text-event">(Event)</text>

  <!-- Bounded Context: Room Availability -->
  <ellipse cx="740" cy="105" rx="50" ry="30" class="shape-bc" />
  <text x="740" y="102" class="text-bc">Room</text>
  <text x="740" y="114" class="text-bc">Availability</text>

  <!-- Flow: Room Availability -> Notification Service -->
  <line x1="740" y1="135" x2="740" y2="280" class="flow-line" marker-end="url(#arrow)" />
  <rect x="695" y="180" width="95" height="45" class="box-event" />
  <text x="742" y="197" class="text-event">3. Room Marked as</text>
  <text x="742" y="208" class="text-event">Maintenance</text>
  <text x="742" y="218" class="text-event">(Event)</text>

  <!-- Flow: Maintenance -> Notification Service -->
  <line x1="550" y1="230" x2="715" y2="300" class="flow-line" marker-end="url(#arrow)" />
  <rect x="590" y="280" width="90" height="42" class="box-cmd" />
  <text x="635" y="296" class="text-cmd">4. Notify</text>
  <text x="635" y="307" class="text-cmd">Administrator / Staff</text>
  <text x="635" y="317" class="text-cmd">(Command)</text>

  <!-- External System: Notification Service -->
  <circle cx="740" cy="305" r="22" class="shape-ext" />
  <text x="740" y="342" class="label-title">Notification Service</text>
  <text x="740" y="354" class="label-sub">(Email / Push /</text>
  <text x="740" y="365" class="label-sub">In-App Notification)</text>

  <!-- Flow: Notification Service -> Staff / Admin Notified -->
  <line x1="762" y1="305" x2="825" y2="305" class="flow-line" marker-end="url(#arrow)" />
  <rect x="835" y="285" width="85" height="42" class="box-event" />
  <text x="877" y="302" class="text-event">5. Staff / Admin</text>
  <text x="877" y="313" class="text-event">Notified</text>
  <text x="877" y="323" class="text-event">(Event)</text>

  <!-- Flow: Maintenance -> App (Status Visible) -->
  <line x1="495" y1="255" x2="495" y2="400" class="flow-line" marker-end="url(#arrow)" />
  <rect x="445" y="335" width="105" height="45" class="box-event" />
  <text x="497" y="352" class="text-event">6. Maintenance Issue</text>
  <text x="497" y="363" class="text-event">Visible in Dashboard</text>
  <text x="497" y="373" class="text-event">(Event)</text>

  <!-- External System: Mobile App (Android) - Inferior -->
  <circle cx="495" cy="420" r="22" class="shape-ext" />
  <text x="495" y="458" class="label-title">Smart Stay Mobile App</text>
  <text x="495" y="470" class="label-sub">(Android)</text>

  <!-- Flow: App Inferior -> Staff -->
  <path d="M 470" y="420" d="M 473 420 L 375 420" class="flow-line" marker-end="url(#arrow)" />
  <rect x="300" y="400" width="80" height="42" class="box-event" />
  <text x="340" y="417" class="text-event">7. Issue Status</text>
  <text x="340" y="428" class="text-event">Reflected in App</text>
  <text x="340" y="438" class="text-event">(Event)</text>
  <path d="M 300 420 L 265 420 L 265 345 L 85 345 L 85 275" class="flow-line" marker-end="url(#arrow)" />

  <!-- Legend -->
  <rect x="35" y="375" width="140" height="110" rx="3" stroke="#999" stroke-width="1" stroke-dasharray="3,3" fill="#fff" />
  <text x="45" y="392" style="font-size:10px; font-weight:bold; fill:#333;">Legend</text>
  <rect x="45" y="400" width="14" height="9" class="box-cmd" />
  <text x="65" y="408" style="font-size:8.5px; fill:#333;">Command / Query</text>
  <rect x="45" y="417" width="14" height="9" class="box-event" />
  <text x="65" y="425" style="font-size:8.5px; fill:#333;">Event</text>
  <ellipse cx="52" cy="442" rx="7" ry="5" class="shape-bc" />
  <text x="65" y="445" style="font-size:8.5px; fill:#333;">Bounded Context</text>
  <circle cx="52" cy="462" r="6" class="shape-ext" />
  <text x="65" y="465" style="font-size:8.5px; fill:#333;">External System / Service</text>
</svg>
